buildscript {
    ext {
        assetPipelineVersion = "3.4.7"
        jobDslVersion = "1.89"
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'io.ratpack:ratpack-gradle:1.9.0'
        classpath "com.github.johnrengelman.shadow:com.github.johnrengelman.shadow.gradle.plugin:7.1.2"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:${assetPipelineVersion}"
        classpath "com.bertramlabs.plugins:less-asset-pipeline:${assetPipelineVersion}"
    }
}

// The “ratpack” plugin applies the “application” plugin, making it easy to create a standalone application.
// See: http://gradle.org/docs/current/userguide/application_plugin.html
apply plugin: "io.ratpack.ratpack-groovy"
apply plugin: "com.github.johnrengelman.shadow"
apply plugin: "asset-pipeline"

// Ratpack 1.2's epoll transport relies on Unsafe APIs removed from recent JDKs.
run {
    jvmArgs '-Dratpack.epoll.disable=true', '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

// The “ratpack” plugin is IDEA aware.
// It will create a run configuration in IDEA to launch your app in your IDE, with hot reloading.
apply plugin: "idea"
idea {
    project {
        jdkName "17"
        languageLevel "17"
        ipr {
            withXml { provider ->
                def node = provider.asNode()
                //configure git support for the project in idea
                node.component.find { it.'@name' == 'VcsDirectoryMappings' }?.mapping[0].'@vcs' = 'Git'
            }
        }
    }
}

apply plugin: "eclipse"

repositories {
  mavenCentral()
  maven { url "https://repo.jenkins-ci.org/releases/" }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.codehaus.groovy:groovy-all:2.5.23'
    }
}

dependencies {
    // Default SLF4J binding. Note that this is a blocking implementation.
    // See here for a non blocking appender http://logging.apache.org/log4j/2.x/manual/async.html
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'
    implementation 'com.sun.activation:javax.activation:1.2.0'
    implementation "org.jenkins-ci.plugins:job-dsl-core:${jobDslVersion}"

    implementation "com.bertramlabs.plugins:ratpack-asset-pipeline:${assetPipelineVersion}"
    runtimeOnly "com.bertramlabs.plugins:less-asset-pipeline:${assetPipelineVersion}"

    testImplementation "org.spockframework:spock-core:1.3-groovy-2.5"
}

shadowJar {
    manifest {
        attributes 'Implementation-Version': jobDslVersion
    }
}

tasks.register('stage') {
    dependsOn shadowJar
}
